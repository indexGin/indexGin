name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/refresh_profile.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update contribution statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/refresh_profile.py

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=%238250df
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%23a371f7

      - name: Publish profile updates
        run: |
          set -euo pipefail
          git add README.md assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh profile statistics and contribution graph"
          git push origin HEAD:main
