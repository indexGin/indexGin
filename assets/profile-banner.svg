<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="indexGin — AI Agent Engineering · LLM4OR · Open Source">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f1526" />
      <stop offset="100%" stop-color="#141129" />
    </linearGradient>
    <radialGradient id="glow-violet" cx="72%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#8250DF" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-teal" cx="22%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#a371f7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base background & glows -->
  <rect width="1280" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1280" height="340" rx="16" fill="url(#grid)" />
  <rect width="1280" height="340" rx="16" fill="url(#glow-violet)" />
  <rect width="1280" height="340" rx="16" fill="url(#glow-teal)" />

  <!-- Subtle left geometric polytope / OR graph -->
  <g stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1.2" fill="none">
    <polygon points="86,105 178,68 232,148 164,234 72,196" />
    <line x1="86" y1="105" x2="232" y2="148" stroke-opacity="0.16" />
    <line x1="178" y1="68" x2="164" y2="234" stroke-opacity="0.16" />
    <line x1="72" y1="196" x2="232" y2="148" stroke-opacity="0.12" />
  </g>
  <g fill="#38bdf8" fill-opacity="0.55">
    <circle cx="86" cy="105" r="3" />
    <circle cx="178" cy="68" r="3" />
    <circle cx="232" cy="148" r="3.5" />
    <circle cx="164" cy="234" r="3" />
    <circle cx="72" cy="196" r="2.5" />
  </g>

  <!-- Subtle right agentic node network -->
  <g stroke="#a371f7" stroke-opacity="0.26" stroke-width="1.2" fill="none">
    <path d="M 1030,170 C 1070,110 1125,92 1175,112" />
    <path d="M 1030,170 C 1075,215 1130,240 1188,218" />
    <path d="M 1175,112 L 1210,168 L 1188,218" />
    <circle cx="1115" cy="168" r="46" stroke-dasharray="4 5" stroke-opacity="0.22" />
  </g>
  <g fill="#a371f7" fill-opacity="0.68">
    <circle cx="1030" cy="170" r="4" />
    <circle cx="1175" cy="112" r="3.5" />
    <circle cx="1210" cy="168" r="4" />
    <circle cx="1188" cy="218" r="3.5" />
    <circle cx="1115" cy="168" r="5" fill="#c084fc" />
  </g>

  <!-- Top status pill -->
  <g transform="translate(515, 74)">
    <rect x="0" y="0" width="250" height="28" rx="14" fill="#8250DF" fill-opacity="0.16" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="20" cy="14" r="4" fill="#34d399" />
    <text x="34" y="18.5" fill="#e2e8f0" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.1">OPEN SOURCE · SYSTEMS</text>
  </g>

  <!-- Main Title -->
  <text x="640" y="176" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">indexGin</text>

  <!-- Accent divider -->
  <rect x="380" y="202" width="520" height="2" rx="1" fill="url(#accent-line)" />

  <!-- Subtitle -->
  <text x="640" y="242" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="0.8">AI Agent Engineering  ·  LLM4OR  ·  Coding Agent Harnesses</text>

  <!-- Subtle corner border highlight -->
  <rect x="0.5" y="0.5" width="1279" height="339" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
</svg>
